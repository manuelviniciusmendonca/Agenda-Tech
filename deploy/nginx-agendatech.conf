# ===============================================================
# Agenda Tech - nginx
# ===============================================================
# Copie para /etc/nginx/sites-available/agendatech e troque
# TODAS as ocorrencias de SEUDOMINIO pelo seu nome no DuckDNS.
#
# O certbot adiciona o bloco HTTPS e o redirecionamento sozinho.
# ===============================================================

server {
    listen 80;
    listen [::]:80;

    server_name SEUDOMINIO.duckdns.org;

    root /var/www/agendatech/frontend/dist;
    index index.html;

    client_max_body_size 2m;

    # -----------------------------------------------------------
    # Painel (SPA com React Router)
    # -----------------------------------------------------------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca em cache, para o deploy aparecer na hora
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    # Assets do Vite tem hash no nome: cache longo e seguro
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # -----------------------------------------------------------
    # API -> Express (o /api e removido antes de chegar no Node)
    # -----------------------------------------------------------
    location /api/ {
        proxy_pass http://127.0.0.1:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # -----------------------------------------------------------
    # Webhook do Asaas (mantem o caminho /webhooks/asaas)
    # -----------------------------------------------------------
    location /webhooks/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Webhook precisa de resposta rapida; nao segure o corpo
        proxy_request_buffering off;
        proxy_read_timeout 30s;
    }

    # -----------------------------------------------------------
    # Health check
    # -----------------------------------------------------------
    location = /health {
        proxy_pass http://127.0.0.1:3000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        access_log off;
    }

    # -----------------------------------------------------------
    # Compressao
    # -----------------------------------------------------------
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff2;
}
